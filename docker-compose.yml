services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # If connecting directly to remote backend, set the URL here or in .env
        # If using Nginx reverse-proxy to a local backend container on the same network, set to ""
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://tablingtime-backend.onrender.com}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    container_name: tablingtime-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - tablingtime-network

  # (Optional) Uncomment if you want to run the backend container on the same VM
  # backend:
  #   image: <your-backend-image>:latest
  #   # Or build from a local backend folder:
  #   # build:
  #   #   context: ../TablingTime-Backend
  #   #   dockerfile: Dockerfile
  #   container_name: backend
  #   restart: unless-stopped
  #   expose:
  #     - "3000"
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - PORT=3000
  #     # Add other backend environment variables here
  #   networks:
  #     - tablingtime-network

networks:
  tablingtime-network:
    driver: bridge
